}
function freqFor(pos,h){let [r,c]=handPos(h);return charts[CHART_KEY[pos]].cells[r][c].map(x=>x*5)}
function actionName(i){return ["Raise","Call","Fold"][i]}
function strategyText(freq){return ["Raise","Call","Fold"].map((x,i)=>`${x} ${freq[i]}%`).join(" · ")}
function dominant(freq){return freq.indexOf(Math.max(...freq))}
function mixed(freq){return freq.filter(x=>x>0).length>1}
function scoreFor(selected,freq){return freq[selected]||0}

function renderRangeChart(pos){
  const ch=charts[CHART_KEY[pos]];
  const heads=RANKS.map(r=>`<div>${r}</div>`).join("");
  const cells=[];
  for(let r=0;r<13;r++)for(let c=0;c<13;c++){
    const f=ch.cells[r][c].map(x=>x*5);
    const label=handLabel(r,c);
    const style=`background:conic-gradient(from 0deg,var(--raise) 0 ${f[0]}%,var(--call) ${f[0]}% ${f[0]+f[1]}%,var(--fold) ${f[0]+f[1]}% 100%)`;
    cells.push(`<div class="range-cell ${mixed(f)?'mix':''}" style="${style}" title="${label}: Raise ${f[0]}%, Call ${f[1]}%, Fold ${f[2]}%" onclick="showCell('${pos}',${r},${c})">${label}</div>`);
  }
  const bar=`<div class="summarybar"><i style="width:${ch.summary[0]}%"></i><i style="width:${ch.summary[1]}%"></i><i style="width:${ch.summary[2]}%"></i></div>`;
  return `<div class="section-title"><h3>Big Blind Range Chart</h3><span class="pill">100bb · BB</span></div>
  <div class="range-tabs">${POSITIONS.map(p=>`<button class="${p===pos?'active':''}" onclick="setChart('${p}')">vs ${p} RFI</button>`).join("")}</div>
  <div class="summary"><div class="raise">Raise ${ch.summary[0]}%</div><div class="call">Call ${ch.summary[1]}%</div><div class="fold">Fold ${ch.summary[2]}%</div></div>${bar}
  <div class="legend"><span class="raise">Red = Raise</span><span class="call">Green = Call</span><span class="fold">Blue = Fold</span></div>
  <div class="range-wrap" style="margin-top:10px"><div class="range-head">${heads}</div><div class="range-grid">${cells.join("")}</div></div>
  <div id="cell-detail" class="chart-note">Tap any cell to see its Raise / Call / Fold mix.</div>`;
}
let chartPos="BTN";
function setChart(pos){chartPos=pos;const box=document.getElementById("chartbox");if(box)box.innerHTML=renderRangeChart(pos)}
function showCell(pos,r,c){
  const f=charts[CHART_KEY[pos]].cells[r][c].map(x=>x*5), h=handLabel(r,c);
  const detail=document.getElementById("cell-detail");
  if(detail)detail.innerHTML=`<b>${h} vs ${pos} RFI</b> — Raise ${f[0]}% · Call ${f[1]}% · Fold ${f[2]}%. ${mixed(f)?"Mixed strategy: more than one action is intentionally used.":"Pure reference action: "+actionName(dominant(f))+"."}`;
}
function handLabel(r,c){if(r===c)return RANKS[r]+RANKS[c];if(r<c)return RANKS[r]+RANKS[c]+"s";return RANKS[c]+RANKS[r]+"o"}


function spotList(){
  const list=[];
  POSITIONS.forEach(pos=>spotHands[pos].forEach(h=>list.push({pos,h})));
  return list;
}
function spotList2(){
  const list=[];
  POSITIONS.forEach(pos=>spotHands2[pos].forEach(h=>list.push({pos,h})));
  return list;
}
function spotList3(){const list=[]; POSITIONS.forEach(pos=>spotHands3[pos].forEach(h=>list.push({pos,h}))); return list;}
const spots=spotList(), spots2=spotList2(), spots3=spotList3();

function cardMarkup(hand){
  const suits=hand.endsWith("s")?["♠","♠"]:hand.endsWith("h")?["♥","♥"]:hand.endsWith("d")?["♦","♦"]:["♠","♦"];
  const ranks=hand.slice(0,2);
  return `<div class="playing-card ${suits[0]==="♥"||suits[0]==="♦"?'red':''}"><div>${ranks[0]}</div><div class="suit">${suits[0]}</div></div><div class="playing-card ${suits[1]==="♥"||suits[1]==="♦"?'red':''}"><div>${ranks[1]}</div><div class="suit">${suits[1]}</div></div>`;
}
function spotCard(spot,i,answers){
  const f=freqFor(spot.pos,spot.h), ans=answers[i], submitted=ans!==undefined;
  const result=submitted?scoreFor(ans,f):null;
  const tone=submitted?(result>0?"good":"bad"):"";
  const buttons=["Raise (3-bet)","Call","Fold"].map((x,j)=>`<button class="chip ${ans===j?'sel':''}" onclick="answerCurrent(${i},${j})" ${submitted?'disabled':''}>${x}</button>`).join("");
  const feedback=submitted?`<div class="feedback ${tone}"><b>${result>0?"Strategically valid action.":"Not in the supplied reference strategy."}</b><div class="explain"><p><b>Reference frequency:</b> ${strategyText(f)}</p><p><b>Strategy fit:</b> ${result}%</p><p>${mixed(f)?"Mixed cell: multiple actions are intentionally part of the strategy. Your score reflects the selected action's reference frequency.":"Pure cell: the supplied chart assigns the strategy to one action."}</p></div></div>`:"";
  const chart=submitted?`<div class="card"><div id="chartbox">${renderRangeChart(spot.pos)}</div></div>`:"";
  return `<div class="card drill-card"><div class="section-title"><h3>Spot ${i+1} of 50</h3><span class="pill">${spot.pos} · 100bb</span></div>
  <div class="poker-table"><div class="table-top">TOURNAMENT 8-MAX · 100BB</div><div class="table-felt"></div>
    <div class="seat utg folded"><div class="seatbox">UTG<div class="role">folded</div></div></div>
    <div class="seat utg1 folded"><div class="seatbox">UTG+1<div class="role">folded</div></div></div>
    <div class="seat lj folded"><div class="seatbox">LJ<div class="role">folded</div></div></div>
    <div class="seat hj folded"><div class="seatbox">HJ<div class="role">folded</div></div></div>
    <div class="seat co ${spot.pos==='CO'?'raiser active':'folded'}"><div class="seatbox">CO<div class="role">${spot.pos==='CO'?'RFI':'folded'}</div>${spot.pos==='CO'?'<div class="chips"><i class="chip-stack"></i><i class="chip-stack"></i></div><div class="bet">2.2bb</div>':''}</div></div>
    <div class="seat btn ${spot.pos==='BTN'?'raiser active':'folded'}"><div class="seatbox">BTN<div class="role">${spot.pos==='BTN'?'RFI':'folded'}</div>${spot.pos==='BTN'?'<div class="chips"><i class="chip-stack"></i><i class="chip-stack"></i></div><div class="bet">2.2bb</div>':''}</div></div>
    <div class="seat sb ${spot.pos==='SB'?'raiser active':'folded'}"><div class="seatbox">SB<div class="role">${spot.pos==='SB'?'RFI':'folded'}</div>${spot.pos==='SB'?'<div class="chips"><i class="chip-stack"></i><i class="chip-stack"></i></div><div class="bet">2.5bb</div>':''}</div></div>
    <div class="seat bb hero active"><div class="seatbox">BB<div class="role">HERO · 100bb</div><div class="chips"><i class="chip-stack"></i><i class="chip-stack"></i><i class="chip-stack"></i></div></div></div>
    <div class="table-center"><div class="pot">BB vs ${spot.pos} RFI</div><div class="action">${spot.pos} opens · Hero to act</div></div>
    <div class="hero-cards">${cardMarkup(spot.h)}</div>
  </div>
  <div class="spot-meta"><span class="pill">Position: BB</span><span class="pill">Opponent: ${spot.pos}</span><span class="pill">Action: vs RFI</span><span class="pill">Stack: 100bb</span></div>
  <p style="margin-top:14px"><b>Your action?</b></p><div class="chiprow">${buttons}</div>${feedback}
  ${submitted?`<div class="freqline"><span class="freq r">Raise ${f[0]}%</span><span class="freq c">Call ${f[1]}%</span><span class="freq f">Fold ${f[2]}%</span></div>`:""}</div>${chart}`;
}

function renderDay1(){
  const answered=Object.keys(S.answers).length;
  const score=Object.entries(S.answers).reduce((sum,[i,a])=>sum+scoreFor(+a,freqFor(spots[+i].pos,spots[+i].h)),0);
  const avg=answered?Math.round(score/answered):0;
  const i=Math.min(S.spot,spots.length-1), spot=spots[i];
  document.getElementById("header").textContent=`Day 1/30 · ${answered}/${spots.length} spots · ${avg}% strategy fit`;
  document.getElementById("today").innerHTML=`${spotCard(spot,i,S.answers)}
  <div class="card compact-progress"><div class="section-title"><b>Today's progress</b><span class="pill">${answered}/50 · ${answered?avg+"% fit":"—"}</span></div><div class="bar"><i style="width:${answered/50*100}%"></i></div><div class="nextbar"><button class="btn secondary" onclick="prevSpot()" ${i===0?'disabled':''}>← Previous</button><span class="tiny">Spot ${i+1}/50</span><button class="btn" onclick="nextSpot()" ${i>=49?'disabled':''}>Next →</button></div></div>
  <div class="card"><div class="section-title"><b>50-spot route</b><span class="pill">50 total</span></div><div class="muted">UTG 5 · UTG+1 5 · LJ 6 · HJ 7 · CO 8 · BTN 14 · SB 5</div></div>
  <div class="card"><div class="section-title"><h3>Finish Chunk 1</h3><span class="pill">${answered}/50</span></div><p class="muted">Complete all 50 Chunk 1 spots before moving to Chunk 2.</p><button class="btn" onclick="completeDay1()" ${answered<50?'disabled':''}>Complete Day 1</button></div>`;
}
function renderDay2(){
  const answered=Object.keys(S.answers2).length;
  const score=Object.entries(S.answers2).reduce((sum,[i,a])=>sum+scoreFor(+a,freqFor(spots2[+i].pos,spots2[+i].h)),0);
  const avg=answered?Math.round(score/answered):0;
  const i=Math.min(S.spot2,spots2.length-1), spot=spots2[i];
  document.getElementById("header").textContent=`Day 2/30 · ${answered}/50 spots · ${avg}% strategy fit`;
  document.getElementById("today").innerHTML=`${spotCard(spot,i,S.answers2)}
  <div class="card compact-progress"><div class="section-title"><b>Chunk 2 progress</b><span class="pill">${answered}/50 · ${answered?avg+"% fit":"—"}</span></div><div class="bar"><i style="width:${answered/50*100}%"></i></div><div class="nextbar"><button class="btn secondary" onclick="prevSpot2()" ${i===0?'disabled':''}>← Previous</button><span class="tiny">Spot ${i+1}/50</span><button class="btn" onclick="nextSpot2()" ${i>=49?'disabled':''}>Next →</button></div></div>
  <div class="card"><div class="section-title"><b>Chunk 2 route</b><span class="pill">50 total</span></div><div class="muted">UTG 7 · UTG+1 7 · LJ 7 · HJ 7 · CO 7 · BTN 10 · SB 5</div></div>
  <div class="card"><div class="section-title"><h3>Finish Chunk 2</h3><span class="pill">${answered}/50</span></div><p class="muted">Complete all 50 new spots to unlock Day 3.</p><button class="btn" onclick="completeDay2()" ${answered<50?'disabled':''}>Complete Day 2</button></div>`;
}
function renderDay3(){
  const answered=Object.keys(S.answers3).length;
  const score=Object.entries(S.answers3).reduce((sum,[i,a])=>sum+scoreFor(+a,freqFor(spots3[+i].pos,spots3[+i].h)),0);
  const avg=answered?Math.round(score/answered):0;
  const i=Math.min(S.spot3,spots3.length-1), spot=spots3[i];
  document.getElementById("header").textContent=`Day 3/30 · ${answered}/50 mixed spots · ${avg}% strategy fit`;
  document.getElementById("today").innerHTML=`${spotCard(spot,i,S.answers3)}
  <div class="card compact-progress"><div class="section-title"><b>Chunk 3 progress</b><span class="pill">${answered}/50 · ${answered?avg+"% fit":"—"}</span></div><div class="bar"><i style="width:${answered/50*100}%"></i></div><div class="nextbar"><button class="btn secondary" onclick="prevSpot3()" ${i===0?'disabled':''}>← Previous</button><span class="tiny">Spot ${i+1}/50</span><button class="btn" onclick="nextSpot3()" ${i>=49?'disabled':''}>Next →</button></div></div>
  <div class="card"><div class="section-title"><b>Chunk 3 route</b><span class="pill">50 total</span></div><div class="muted">UTG 7 · UTG+1 7 · LJ 8 · HJ 8 · CO 8 · BTN 6 · SB 6</div></div>
  <div class="card"><div class="section-title"><h3>Finish Chunk 3</h3><span class="pill">${answered}/50</span></div><p class="muted">Complete all 50 mixed-strategy spots to unlock Day 4.</p><button class="btn" onclick="completeDay3()" ${answered<50?'disabled':''}>Complete Day 3</button></div>`;
}
function renderToday(){
  if(S.day>=3) renderDay3(); else if(S.day>=2) renderDay2(); else renderDay1();
}

function answerCurrent(i,j){
  const target=S.day>=3?S.answers3:(S.day>=2?S.answers2:S.answers);
  if(target[i]!==undefined)return;
  target[i]=j; save(); renderToday(); window.scrollTo(0,0);
}
function nextSpot(){S.spot=Math.min(S.spot+1,49);save();renderToday();window.scrollTo(0,0)}
function prevSpot(){S.spot=Math.max(S.spot-1,0);save();renderToday();window.scrollTo(0,0)}
function nextSpot2(){S.spot2=Math.min(S.spot2+1,49);save();renderToday();window.scrollTo(0,0)}
function prevSpot2(){S.spot2=Math.max(S.spot2-1,0);save();renderToday();window.scrollTo(0,0)}
function nextSpot3(){S.spot3=Math.min(S.spot3+1,49);save();renderToday();window.scrollTo(0,0)}
function prevSpot3(){S.spot3=Math.max(S.spot3-1,0);save();renderToday();window.scrollTo(0,0)}
function completeDay1(){if(Object.keys(S.answers).length<50)return;if(!S.done.includes(1))S.done.push(1);S.day=Math.max(S.day,2);S.spot2=0;save();renderToday()}
function completeDay2(){if(Object.keys(S.answers2).length<50)return;if(!S.done.includes(2))S.done.push(2);S.day=Math.max(S.day,3);save();renderToday()}
function completeDay3(){if(Object.keys(S.answers3).length<50)return;if(!S.done.includes(3))S.done.push(3);S.day=Math.max(S.day,4);save();renderToday()}

function renderTrain(){
 document.getElementById("train").innerHTML=`<div class="card hero"><div class="kicker">Curriculum</div><div class="title">30-day tournament progression</div><p class="muted">Two preflop precision blocks are now live. Later days remain staged until their reference material is verified to the same standard.</p></div>${roadmap.map((x,i)=>`<div class="row"><b>${x[0]} · ${x[1]}</b><span class="pill">${i<3?(S.done.includes(i+1)?"COMPLETE":"LIVE"):"ROADMAP"}</span><div class="muted">${x[2]}</div></div>`).join("\n")}`;
}

function renderReview(){
 document.getElementById("review").innerHTML=`<div class="card"><div class="kicker">Hand review lab</div><h2>Capture uncertainty</h2><p class="muted">Save hands where your reasoning felt unclear, not only huge pots.</p>
 <label>Hand / situation</label><textarea id="ht" placeholder="30bb, BTN opens 2.2x, BB calls..."></textarea><label>My decision</label><input id="dec" placeholder="Bet 25%"><label>Confidence 1–5</label><select id="conf"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><label>What was I thinking?</label><textarea id="think"></textarea><label>After review: what would I change?</label><textarea id="learn"></textarea><div class="actions"><button class="btn" id="saveh">Save hand</button></div></div>
 <div class="card"><h3>Saved hands (${S.hands.length})</h3><div class="list">${S.hands.slice().reverse().map(h=>`<div class="row"><b>${esc(h.date)}</b><span class="pill">Confidence ${esc(h.conf)}/5</span><div style="margin-top:7px">${esc(h.hand)}</div><div class="muted"><b>Decision:</b> ${esc(h.dec)}</div><div class="muted"><b>Thinking:</b> ${esc(h.think)}</div><p><b>Lesson:</b> ${esc(h.learn||"Add after review.")}</p></div>`).join("")||"<p class='muted'>No hands saved yet.</p>"}</div></div>`;
 document.getElementById("saveh").onclick=()=>{let h={date:new Date().toLocaleString(),hand:ht.value,dec:dec.value,conf:conf.value,think:think.value,learn:learn.value};if(!h.hand.trim())return;S.hands.push(h);save();renderReview()}
}

function renderProgress(){
 const a1=Object.keys(S.answers).length, a2=Object.keys(S.answers2).length, a3=Object.keys(S.answers3).length;
 const score1=Object.entries(S.answers).reduce((sum,[i,a])=>sum+scoreFor(+a,freqFor(spots[+i].pos,spots[+i].h)),0);
 const score2=Object.entries(S.answers2).reduce((sum,[i,a])=>sum+scoreFor(+a,freqFor(spots2[+i].pos,spots2[+i].h)),0);
 const score3=Object.entries(S.answers3).reduce((sum,[i,a])=>sum+scoreFor(+a,freqFor(spots3[+i].pos,spots3[+i].h)),0);
 const answered=a1+a2+a3, score=score1+score2+score3, avg=answered?Math.round(score/answered):0;
 document.getElementById("progress").innerHTML=`<div class="card hero"><div class="kicker">Development</div><div class="title">Process over results</div><div class="grid"><div class="stat"><span class="tiny">Days complete</span><b>${S.done.length}/30</b></div><div class="stat"><span class="tiny">Chunk 1</span><b>${a1}/50</b></div><div class="stat"><span class="tiny">Chunk 2</span><b>${a2}/50</b></div><div class="stat"><span class="tiny">Chunk 3</span><b>${a3}/50</b></div><div class="stat"><span class="tiny">Overall fit</span><b>${answered?avg+"%":"—"}</b></div><div class="stat"><span class="tiny">Hands reviewed</span><b>${S.hands.length}</b></div></div></div>
 <div class="card"><h3>Chunk performance</h3><div class="row"><b>Chunk 1</b><span class="pill">${a1}/50</span><div class="muted">Strategy fit: ${a1?Math.round(score1/a1)+"%":"—"}</div></div><div class="row"><b>Chunk 2</b><span class="pill">${a2}/50</span><div class="muted">Strategy fit: ${a2?Math.round(score2/a2)+"%":"—"}</div></div><div class="row"><b>Chunk 3</b><span class="pill">${a3}/50</span><div class="muted">Strategy fit: ${a3?Math.round(score3/a3)+"%":"—"}</div></div></div>
 <div class="card"><h3>Weekly review</h3><textarea id="wn" placeholder="What improved? What keeps going wrong? What will I focus on next week?">${esc(S.notes)}</textarea><div class="actions"><button class="btn" onclick="S.notes=document.getElementById('wn').value;save();renderProgress()">Save review</button></div></div>
 <div class="card"><h3>Chart coverage</h3>${POSITIONS.map(p=>`<div class="row" style="margin-top:7px"><b>BB vs ${p}</b><div class="muted">Reference: Raise ${charts[CHART_KEY[p]].summary[0]}% · Call ${charts[CHART_KEY[p]].summary[1]}% · Fold ${charts[CHART_KEY[p]].summary[2]}%</div></div>`).join("")}</div>
 <div class="card"><button class="btn ghost" onclick="if(confirm('Reset all app data?')){localStorage.removeItem('pc_pwa_v8');localStorage.removeItem('pc_pwa_v6');localStorage.removeItem('pc_pwa_v5');localStorage.removeItem('pc_pwa_v4');location.reload()}">Reset all data</button></div>`;
}
function render(){page("today")}
render();
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body></html>
