function renderDrills(){const n=currentChunk(),d=chunkData(n),weak=weakAreas(n), active=S.drill.chunk===n&&S.drill.items.length===10&&Object.keys(S.drill.answers).length<10;let body=`<div class="card hero"><div class="kicker">Adaptive practice</div><div class="title">Drills</div><p class="muted">Practice the positions that are costing you the most strategy fit. Drills do not overwrite your original 50-spot results.</p></div>`;
 if(!weak.length){body+=`<div class="card good"><h3>No major weak area</h3><p>Your current ${d.label} positions are at 70%+ fit where enough spots have been answered. Keep training for consistency.</p></div>`}else{body+=`<div class="card"><h3>Needs practice</h3>${weak.map(w=>`<div class="row"><b>BB defence vs ${w.pos}</b><span class="pill">${w.fit}% fit</span><div class="muted">${w.spots} spots answered · targeted drill recommended</div></div>`).join("")}<div class="actions"><button class="btn" onclick="buildDrill(${n})">Start 10-spot remedial drill</button></div></div>`}
 if(active){const di=S.drill.idx,spot=d.spots[S.drill.items[di]],f=freqFor(spot.pos,spot.h),ans=S.drill.answers[di],submitted=ans!==undefined;body+=`<div class="card"><div class="section-title"><h3>Remedial spot ${di+1}/10</h3><span class="pill">${spot.pos} · ${spot.h}</span></div><p><b>Choose your action</b></p><div class="chiprow">${["Raise (3-bet)","Call","Fold"].map((x,j)=>`<button class="chip ${submitted?actionClass(j,f):""}" onclick="drillAnswer(${j})" ${submitted?'disabled':''}>${submitted?x+` · ${f[j]}%`:x}</button>`).join("")}</div>${submitted?`<div class="nextbar"><span class="tiny">${di+1}/10</span><button class="btn" onclick="S.drill.idx=Math.min(9,S.drill.idx+1);save();renderDrills()" ${di>=9?'disabled':''}>Next →</button></div>`:""}</div>`}else if(S.drill.items.length===10&&Object.keys(S.drill.answers).length===10){const sc=Object.entries(S.drill.answers).reduce((sum,[i,a])=>sum+scoreFor(+a,freqFor(d.spots[S.drill.items[+i]].pos,d.spots[S.drill.items[+i]].h)),0);const fit=Math.round(sc/10);body+=`<div class="card"><h3>Drill result</h3><div class="stat"><span class="tiny">Strategy fit</span><b>${fit}%</b></div><p class="muted">${fit>=70?'Pass — this remedial set is strong enough to unlock progression.':'Not yet — repeat the drill and focus on the weakest position.'}</p><button class="btn" onclick="finishDrill()">Record result</button></div>`}
 const runs=S.drillRuns.filter(r=>r.chunk===n).slice(-5).reverse();if(runs.length)body+=`<div class="card"><h3>Recent remedial drills</h3>${runs.map(r=>`<div class="row"><b>${r.fit}% fit</b><span class="pill">${r.passed?'PASS':'REPEAT'}</span><div class="muted">${esc(r.date)}</div></div>`).join("")}</div>`;document.getElementById("drills").innerHTML=body}


const lessons=[
 {id:1,title:"Preflop baseline",kicker:"Stage 1",body:`<div class="concept"><b>Build the decision before the cards become difficult.</b><br>Start with position, stack depth, players left to act, likely re-raises/calls, and whether your hand is raise-fold, raise-call, or better as an all-in.</div><p>The book treats prepared preflop ranges as a foundation: they reduce hesitation, make repeated spots recognizable, and improve later postflop play because the resulting ranges have better board coverage.</p><div class="decision"><b>Coach cue</b><span class="tag">Position</span><span class="tag">Stack depth</span><span class="tag">Players behind</span><span class="tag">Plan for a jam</span></div>`,source:"Modern Poker Theory — MTT first-in framework"},
 {id:2,title:"Stack depth changes the tree",kicker:"Stage 2",body:`<p>A tournament strategy is not one fixed chart. The book focuses its MTT study on 15bb, 25bb, 40bb and 60bb because stack depth changes which branches are practical.</p><div class="grid"><div class="stat"><span class="tiny">≤10bb</span><b>Push / fold</b><div class="muted">Complexity has less value.</div></div><div class="stat"><span class="tiny">15bb</span><b>Jam + raise</b><div class="muted">Some raise-call / raise-fold planning.</div></div><div class="stat"><span class="tiny">25–40bb</span><b>More branches</b><div class="muted">Rejams and non-all-in 3-bets matter.</div></div><div class="stat"><span class="tiny">60bb+</span><b>Postflop expands</b><div class="muted">More calls and non-all-in 4-bets.</div></div></div>`,source:"Modern Poker Theory — MTT equilibrium strategies by stack depth"},
 {id:3,title:"Sizing is part of the strategy",kicker:"Stage 3",body:`<p>Reasonable RFI sizes do not radically change bottom-line EV by themselves, but larger opens require tighter ranges. Therefore the size and range have to be designed together.</p><div class="concept"><b>Rule:</b> never memorize an open size without also knowing what range it is meant to support.</div><p>As stacks deepen, the strategic tree becomes more complex. The book also emphasizes that deeper stacks make postflop play more attractive.</p>`,source:"Modern Poker Theory — RFI sizing and stack-depth discussion"},
 {id:4,title:"Limping: use where the tree supports it",kicker:"Stage 4",body:`<p>Limping is not a universal “GTO trick.” The book shows its value most clearly in blind-vs-blind situations and notes that limping becomes more frequent as stacks deepen in the SB.</p><p>Outside the blinds and BTN, the book deliberately avoids broad limping strategies because extra players can over-limp or raise and the additional game-tree complexity may not justify the gain.</p><div class="decision"><b>Practical lesson</b>Prioritize SB/BB limp trees first. Do not add limps everywhere just to make the strategy look sophisticated.</div>`,source:"Modern Poker Theory — SB strategy and cutoff/BTN limping discussion"},
 {id:5,title:"Facing a 3-bet",kicker:"Stage 5",body:`<p>The correct response depends heavily on stack depth and position. With 25–40bb, all-in responses still exist in the tree. With 60–80bb, all-in 4-bets give way to non-all-in 4-bets and calling becomes more attractive, especially in position.</p><div class="concept"><b>Decision sequence:</b> identify stack depth → identify IP/OOP → compare jam / 4-bet / call / fold → preserve a coherent range.</div>`,source:"Modern Poker Theory — playing versus 3-bets"},
 {id:6,title:"4-bets are not automatically all-in",kicker:"Stage 6",body:`<p>As stacks get deeper, non-all-in 4-bets become more important. The book explicitly describes a reduction in all-in 4-betting at 60–80bb and an increase in calling because deeper stacks create more postflop value.</p><p>The coaching goal is to recognize when the tree has moved from a binary “jam or fold” problem into a multi-branch postflop problem.</p>`,source:"Modern Poker Theory — 60–80bb response to non-all-in 3-bets"},
 {id:7,title:"Tournament layer",kicker:"Stage 7",body:`<p>MTT equilibrium is a baseline, not a promise of one permanently optimal strategy. Tournament chips do not have a fixed cash value, and the book stresses tournament life, changing variables, and adapting the baseline to the game.</p><div class="decision"><b>Coach cue</b>Baseline first. Adapt second. Do not use “GTO” as an excuse to stop thinking.</div>`,source:"Modern Poker Theory — tournament theory and conclusion"}
];

function renderStudy(){
 const l=lessons.find(x=>x.id===S.studyLesson)||lessons[0], li=lessons.indexOf(l), answered=Object.keys(S.labAnswers).length, current=lab[Math.min(S.labIdx,lab.length-1)], ca=S.labAnswers[S.labIdx], submitted=ca!==undefined;
 document.getElementById("study").innerHTML=`<div class="card hero"><div class="kicker">Pass 3 · Theory foundation</div><div class="title">Study → Decide → Adapt</div><p class="muted">This is the next layer of the coach: learn the principle, then practice choosing the correct branch. The lesson text is an original coaching summary based on the uploaded book.</p></div>
 <div class="card"><div class="lesson-nav">${lessons.map(x=>`<button class="${x.id===l.id?'active':''}" onclick="S.studyLesson=${x.id};save();renderStudy()">${x.id}. ${x.title}</button>`).join("")}</div><div style="margin-top:12px"><div class="kicker">${l.kicker}</div><h2>${l.title}</h2>${l.body}<div class="sourcebox"><b>Book anchor:</b> ${l.source}</div></div><div class="nextbar"><button class="btn secondary" onclick="S.studyLesson=Math.max(1,S.studyLesson-1);save();renderStudy()" ${li===0?'disabled':''}>← Lesson</button><span class="tiny">${li+1}/${lessons.length}</span><button class="btn" onclick="S.studyLesson=Math.min(${lessons.length},S.studyLesson+1);save();renderStudy()" ${li===lessons.length-1?'disabled':''}>Lesson →</button></div></div>
 <div class="card"><div class="section-title"><h3>Preflop Lab</h3><span class="pill">${answered}/${lab.length}</span></div><p class="muted">These are principle-based branches, not solver-range substitutes. They train the decision process that sits underneath the ranges.</p><div class="decision"><b>Scenario ${S.labIdx+1}/10</b>${current.q}</div>${current.a.map((x,i)=>`<button class="lab-choice ${submitted?(i===current.c?'correct':(i===ca?'wrong':'')):''}" onclick="labAnswer(${i})" ${submitted?'disabled':''}>${x}</button>`).join("")}${submitted?`<div class="feedback ${ca===current.c?'good':'bad'}"><b>${ca===current.c?'Correct branch':'Review the branch'}</b><div style="margin-top:5px">${current.e}</div></div><div class="nextbar"><span class="tiny">${S.labIdx+1}/10</span><button class="btn" onclick="S.labIdx=Math.min(9,S.labIdx+1);save();renderStudy()" ${S.labIdx>=9?'disabled':''}>Next →</button></div>`:''}</div>
 <div class="card"><h3>Pass 3 completion</h3><div class="grid"><div class="stat"><span class="tiny">Lessons</span><b>${S.studyLesson}/7</b></div><div class="stat"><span class="tiny">Lab</span><b>${answered}/10</b></div></div><p class="muted">Pass 3 is designed to make your preflop decisions conditional: stack depth → position → sizing → action sequence → response plan.</p></div>`;
}
function labAnswer(j){if(S.labAnswers[S.labIdx]!==undefined)return;S.labAnswers[S.labIdx]=j;save();renderStudy()}

function treeAnswer(j){if(S.treeAnswers[S.treeIdx]!==undefined)return;S.treeAnswers[S.treeIdx]=j;save();renderTree()}

function renderTree(){
 const t=treeSpots[S.treeIdx], ans=S.treeAnswers[S.treeIdx], submitted=ans!==undefined, correct=submitted&&ans===t.c, done=Object.keys(S.treeAnswers).length, score=Object.entries(S.treeAnswers).reduce((n,[i,a])=>n+(+a===treeSpots[+i].c?1:0),0);
 document.getElementById("tree").innerHTML=`<div class="card hero"><div class="kicker">Pass 4 · Preflop decision tree</div><div class="title">Think in branches</div><p class="muted">This is the first genuine decision-tree layer. It does not replace solver ranges; it teaches you to select the correct strategic branch from stack depth, position and action sequence.</p><div class="tree-steps"><span class="tree-step active">1 Stack</span><span class="tree-step">2 Position</span><span class="tree-step">3 Sizing</span><span class="tree-step">4 Action</span><span class="tree-step">5 Response</span></div></div>
 <div class="card"><div class="section-title"><h3>${t.title}</h3><span class="pill">${S.treeIdx+1}/${treeSpots.length}</span></div><div class="spot-meta">${t.tags.map(x=>`<span class="tag">${x}</span>`).join("")}</div><p class="muted">${t.meta}</p><div class="decision"><b>Decision point</b>${t.q}</div>${t.a.map((x,i)=>`<button class="tree-choice ${submitted?(i===t.c?'correct':(i===ans?'wrong':'')):''}" onclick="treeAnswer(${i})" ${submitted?'disabled':''}>${x}</button>`).join("")}${submitted?`<div class="feedback ${correct?'good':'bad'}"><b>${correct?'Correct branch':'Wrong branch'}</b><div style="margin-top:5px">${t.branch}</div></div><div class="nextbar"><button class="btn secondary" onclick="treePrev()" ${S.treeIdx===0?'disabled':''}>← Previous</button><span class="tiny">${score}/${done} correct</span><button class="btn" onclick="treeNext()" ${S.treeIdx===treeSpots.length-1?'disabled':''}>Next →</button></div>`:''}</div>
 <div class="card"><div class="section-title"><h3>Tree progress</h3><button class="btn ghost" onclick="resetTree()">Reset tree</button></div><div class="tree-metric"><div><span class="tiny">Answered</span><b>${done}</b></div><div><span class="tiny">Correct</span><b>${score}</b></div><div><span class="tiny">Fit</span><b>${done?Math.round(score/done*100):0}%</b></div></div><p class="muted">Finish the tree once, then repeat it later from memory. The goal is automatic branch recognition, not speed.</p></div>`;
}

 {title:"Turn planning starts on the flop",meta:"BTN vs BB · 40bb",q:"Why should your flop decision consider the turn before you act?",a:["Because flop actions are irrelevant once the turn arrives","Because good flop play should help create profitable future-street situations","Because you should always barrel the turn"],c:1,e:"The book explicitly frames solver construction as future-street planning: river situations inform turn strategy, which informs flop strategy, which informs preflop strategy." ,tags:["turn planning","future streets","EV"]},
 {title:"Flop simplification",meta:"BTN vs BB · 40bb",q:"What is the right way to use a simplified betting strategy?",a:["Use one practical size when it retains most of the strategy's EV, rather than memorizing every tiny solver mix","Replace all GTO strategy with one bet size forever","Ignore board texture"],c:0,e:"Acevedo repeatedly argues that some multi-size solver outputs can be simplified to a small number of practical sizes while retaining nearly all of the EV. The correct simplification depends on the spot." ,tags:["simplification","sizing","GTO"]}
];
function flopAnswer(j){if(S.flopAnswers[S.flopIdx]!==undefined)return;S.flopAnswers[S.flopIdx]=j;save();renderFlop()}
function flopPrev(){if(S.flopIdx>0){S.flopIdx--;save();renderFlop()}}
function flopNext(){if(S.flopIdx<flopSpots.length-1){S.flopIdx++;save();renderFlop()}}
function resetFlop(){S.flopIdx=0;S.flopAnswers={};save();renderFlop()}
function renderFlop(){
 const t=flopSpots[S.flopIdx],ans=S.flopAnswers[S.flopIdx],submitted=ans!==undefined,correct=submitted&&ans===t.c,done=Object.keys(S.flopAnswers).length,score=Object.entries(S.flopAnswers).reduce((n,[i,a])=>n+(+a===flopSpots[+i].c?1:0),0);
 document.getElementById("flop").innerHTML=`<div class="card hero"><div class="kicker">Pass 6 · BTN GTO flop engine</div><div class="title">BTN → Flop → Think in ranges</div><p class="muted">One position, one opponent, one street at a time. This block builds the flop layer before we add turn branches. No invented solver frequencies: where the source gives an exact simplification, it is labelled; elsewhere you are training the underlying GTO reasoning.</p><div class="tree-steps"><span class="tree-step active">1 Preflop context</span><span class="tree-step active">2 Board texture</span><span class="tree-step active">3 Range interaction</span><span class="tree-step">4 Action</span><span class="tree-step">5 Turn plan</span></div></div>
 <div class="card"><div class="section-title"><h3>${t.title}</h3><span class="pill">${S.flopIdx+1}/${flopSpots.length}</span></div><div class="spot-meta">${t.tags.map(x=>`<span class="tag">${x}</span>`).join("")}</div><p class="muted">${t.meta}</p><div class="decision"><b>Decision point</b>${t.q}</div>${t.a.map((x,i)=>`<button class="tree-choice ${submitted?(i===t.c?'correct':(i===ans?'wrong':'')):''}" onclick="flopAnswer(${i})" ${submitted?'disabled':''}>${x}</button>`).join("")}${submitted?`<div class="feedback ${correct?'good':'bad'}"><b>${correct?'Correct GTO principle':'Review the principle'}</b><div style="margin-top:5px">${t.e}</div></div><div class="nextbar"><button class="btn secondary" onclick="flopPrev()" ${S.flopIdx===0?'disabled':''}>← Previous</button><span class="tiny">${score}/${done} correct</span><button class="btn" onclick="flopNext()" ${S.flopIdx===flopSpots.length-1?'disabled':''}>Next →</button></div>`:''}</div>
 <div class="card"><div class="section-title"><h3>Flop progress</h3><button class="btn ghost" onclick="resetFlop()">Reset flop</button></div><div class="tree-metric"><div><span class="tiny">Answered</span><b>${done}</b></div><div><span class="tiny">Correct</span><b>${score}</b></div><div><span class="tiny">Fit</span><b>${done?Math.round(score/done*100):0}%</b></div></div><p class="muted">Target: build automatic board classification, range interaction and sizing logic before adding the turn.</p></div>`;
}

function completeDay1(){if(Object.keys(S.answers).length<50)return;if(!S.done.includes(1))S.done.push(1);S.day=Math.max(S.day,2);S.spot2=0;save();renderToday()}
function completeDay2(){if(Object.keys(S.answers2).length<50)return;if(!S.done.includes(2))S.done.push(2);S.day=Math.max(S.day,3);save();renderToday()}
function completeDay3(){if(Object.keys(S.answers3).length<50)return;if(!S.done.includes(3))S.done.push(3);S.day=Math.max(S.day,4);save();renderToday()}

function renderTrain(){
 document.getElementById("train").innerHTML=`<div class="card hero"><div class="kicker">Curriculum</div><div class="title">30-day tournament progression</div><p class="muted">Three BB-vs-RFI precision blocks and the Pass 3 study layer are live. Pass 4 added the preflop decision tree. Pass 6 now begins the BTN postflop sequence: flop first, then turn and river.</p></div>${roadmap.map((x,i)=>`<div class="row"><b>${x[0]} · ${x[1]}</b><span class="pill">${i<4?(S.done.includes(i+1)?"COMPLETE":"LIVE"):"ROADMAP"}</span><div class="muted">${x[2]}</div></div>`).join("\n")}`;
}

function renderReview(){
 document.getElementById("review").innerHTML=`<div class="card"><div class="kicker">Hand review lab</div><h2>Capture uncertainty</h2><p class="muted">Save hands where your reasoning felt unclear, not only huge pots.</p>
 <label>Hand / situation</label><textarea id="ht" placeholder="30bb, BTN opens 2.2x, BB calls..."></textarea><label>My decision</label><input id="dec" placeholder="Bet 25%"><label>Confidence 1–5</label><select id="conf"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><label>What was I thinking?</label><textarea id="think"></textarea><label>After review: what would I change?</label><textarea id="learn"></textarea><div class="actions"><button class="btn" id="saveh">Save hand</button></div></div>
 <div class="card"><h3>Saved hands (${S.hands.length})</h3><div class="list">${S.hands.slice().reverse().map(h=>`<div class="row"><b>${esc(h.date)}</b><span class="pill">Confidence ${esc(h.conf)}/5</span><div style="margin-top:7px">${esc(h.hand)}</div><div class="muted"><b>Decision:</b> ${esc(h.dec)}</div><div class="muted"><b>Thinking:</b> ${esc(h.think)}</div><p><b>Lesson:</b> ${esc(h.learn||"Add after review.")}</p></div>`).join("")||"<p class='muted'>No hands saved yet.</p>"}</div></div>`;
 document.getElementById("saveh").onclick=()=>{let h={date:new Date().toLocaleString(),hand:ht.value,dec:dec.value,conf:conf.value,think:think.value,learn:learn.value};if(!h.hand.trim())return;S.hands.push(h);save();renderReview()}
}

function renderProgress(){
 const chunks=[1,2,3], stats=chunks.map(n=>({n,...chunkStats(n)}));
 const answered=stats.reduce((x,s)=>x+s.answered,0),score=stats.reduce((x,s)=>x+s.score,0),avg=answered?Math.round(score/answered):0;
 const posRows=POSITIONS.map(p=>{let a=0,sc=0;chunks.forEach(n=>{const q=chunkStats(n).by[p];a+=q.answered;sc+=q.score});const fit=a?Math.round(sc/a):0;const complexity=a?Math.min(3,Math.max(1,Math.ceil((chunks.reduce((z,n)=>z+(chunkStats(n).by[p].answered? n:0),0))/Math.max(1,a)))):0;return {p,a,fit,rating:positionRating(a,fit,complexity)}});
 const overall=positionRating(answered,avg,Math.min(3,stats.filter(s=>s.answered>0).length));
 const weak=weakAreas(currentChunk());
 document.getElementById("progress").innerHTML=`<div class="card hero"><div class="kicker">Development</div><div class="title">Process over results</div><div class="grid"><div class="stat"><span class="tiny">Days complete</span><b>${S.done.length}/30</b></div><div class="stat"><span class="tiny">Overall level</span><b>${overall}</b></div><div class="stat"><span class="tiny">Overall fit</span><b>${answered?avg+"%":"—"}</b></div><div class="stat"><span class="tiny">Hands reviewed</span><b>${S.hands.length}</b></div></div></div>
 <div class="card"><h3>Position ratings</h3><p class="muted">Ratings combine volume, strategy fit, and completed training complexity. They are coaching ratings, not poker-skill labels.</p>${posRows.map(r=>`<div class="row"><div class="section-title"><b>BB vs ${r.p}</b><span class="pill">${r.rating}</span></div><div class="muted">${r.a?`${r.fit}% strategy fit · ${r.a} spots answered`:'Not started'}</div></div>`).join("")}</div>
 <div class="card"><h3>Weak areas</h3>${weak.length?weak.map(w=>`<div class="row"><b>BB defence against ${w.pos} needs practice</b><span class="pill">${w.fit}% fit</span><div class="muted">Use the Drills tab for a targeted 10-spot remedial set.</div></div>`).join(""):`<p class="muted">No major weak area detected in the current chunk.</p>`}</div>
 <div class="card"><h3>Chunk performance</h3>${stats.map(s=>`<div class="row"><b>${s.label}</b><span class="pill">${s.answered}/50</span><div class="muted">Strategy fit: ${s.answered?Math.round(s.score/s.answered)+"%":"—"} · ${canAdvance(s.n)?"Progression ready":"Needs completion or remedial practice"}</div></div>`).join("")}</div>
 <div class="card"><h3>Weekly review</h3><textarea id="wn" placeholder="What improved? What keeps going wrong? What will I focus on next week?">${esc(S.notes)}</textarea><div class="actions"><button class="btn" onclick="S.notes=document.getElementById('wn').value;save();renderProgress()">Save review</button></div></div>
 <div class="card"><h3>Chart coverage</h3>${POSITIONS.map(p=>`<div class="row" style="margin-top:7px"><b>BB vs ${p}</b><div class="muted">Reference: Raise ${charts[CHART_KEY[p]].summary[0]}% · Call ${charts[CHART_KEY[p]].summary[1]}% · Fold ${charts[CHART_KEY[p]].summary[2]}%</div></div>`).join("")}</div>
 <div class="card"><button class="btn ghost" onclick="if(confirm('Reset all app data?')){localStorage.removeItem('pc_pwa_v8');localStorage.removeItem('pc_pwa_v6');localStorage.removeItem('pc_pwa_v5');localStorage.removeItem('pc_pwa_v4');location.reload()}">Reset all data</button></div>`;
}
function render(){page("today")}
render();
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
