let S=JSON.parse(localStorage.getItem("pc_pwa_v2")||"null")||{day:1,done:[],ans:{},lessonAns:{},hands:[],notes:"",exDone:[]}; S.lessonAns=S.lessonAns||{};
function save(){localStorage.setItem("pc_pwa_v2",JSON.stringify(S));render()}
function page(p){document.querySelectorAll("main section").forEach(x=>x.classList.add("hidden"));document.getElementById(p).classList.remove("hidden");document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p)); if(p==="today")renderToday();if(p==="train")renderTrain();if(p==="review")renderReview();if(p==="progress")renderProgress()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>page(b.dataset.page));
function qForDay(d){let ex=examples[(d-1)%examples.length];return ex}
function parseCards(str){const suits={♠:'black',♣:'black',♥:'red',♦:'red'};return (str.match(/[AKQJT2-9][♠♣♥♦]/g)||[]).map(c=>({r:c[0],s:c[1],cls:suits[c[1]]}));}
function cardMarkup(cards){return cards.map(c=>`<div class="playing-card ${c.cls}"><div>${c.r}</div><div class="suit">${c.s}</div></div>`).join('')}
function spotVisual(spot){const lines=spot.h.split('\n'); const hero=(lines.find(x=>x.includes('Hero:'))||'').replace('Hero: ',''); const cards=parseCards(hero); const pot=(lines.find(x=>x.startsWith('Pot:'))||''); const pre=lines.filter(x=>!x.includes('Hero:')&&!x.startsWith('Pot:')).join(' · '); return `<div class="poker-table"><div class="table-top">TOURNAMENT PRACTICE TABLE · ${esc((lines[0]||'').split("·")[0]||'100bb effective')}</div><div class="seat-row"><span>BTN</span><span>SB</span><span>BB · HERO</span></div><div class="action-line">${esc(pre)}</div><div class="cards">${cardMarkup(cards)}</div><div class="pot-line">${esc(pot)}</div><div class="table-hint">Choose your chip amount below</div></div>`}
function renderToday(){
 let lesson=lesson30[Math.min(S.day,30)-1];
 document.getElementById("header").textContent=`Day ${S.day}/90 · ${S.done.length} complete`;
 if(S.day!==1){
   document.getElementById("today").innerHTML=`<div class="card hero"><div class="kicker">Day ${lesson.d} · ${lesson.m}</div><div class="title">${lesson.t}</div><p class="muted">${lesson.p}</p><div class="card" style="margin-top:14px;background:#0b1322"><b>Next lesson is loaded as a placeholder.</b><p class="muted">The first fully playable lesson is Day 1. We're building the later days in the same play-the-hand format.</p></div></div>`;
   return;
 }
 const answered=S.lessonAns||{};
 const completed=day1Spots.filter((_,i)=>answered[i]!==undefined).length;
 const correct=day1Spots.filter((x,i)=>answered[i]!==undefined && answered[i]===x.a).length;
 const cards=day1Spots.map((spot,i)=>{
   const selected=answered[i];
   const submitted=selected!==undefined;
   const opts=spot.opts.map((o,j)=>`<button class="chip ${selected===j?'sel':''}" onclick="pickSpot(${i},${j})" ${submitted?'disabled':''}>${o}</button>`).join('');
   const feedback=submitted?`<div class="feedback ${selected===spot.a?'good':'bad'}"><b>${selected===spot.a?'Correct.':'Review this one.'}</b><div class="explain"><p><b>Benchmark:</b> ${spot.g}</p><p><b>GTO principle:</b> ${spot.gto}</p><p><b>Other things:</b> ${spot.p}</p></div></div>`:'';
   return `<div class="card spot-card"><div class="section-title"><h3>Spot ${i+1} of ${day1Spots.length}</h3><span class="pill">${submitted?(selected===spot.a?'✓ Correct':'Review'):'Not answered'}</span></div>${spotVisual(spot)}<p class="decision-title"><b>${spot.q}</b></p><div class="chiprow">${opts}</div>${feedback}</div>`;
 }).join('');
 document.getElementById("today").innerHTML=`<div class="card hero"><div class="kicker">Day 1 · Preflop</div><div class="title">Big Blind Defence vs Button</div><p class="muted">Today is deliberately practical. See the hand, choose the chips, then get a short benchmark and explanation. Don't try to be perfect — build the process.</p><div class="grid"><div class="stat"><span class="tiny">Lesson</span><b>${completed}/${day1Spots.length} spots</b></div><div class="stat"><span class="tiny">Accuracy</span><b>${completed?Math.round(correct/completed*100)+'%':'—'}</b></div></div><div style="margin-top:15px"><div class="tiny">Today's progress</div><div class="bar"><i style="width:${completed/day1Spots.length*100}%"></i></div></div></div>
 <div class="card"><div class="section-title"><h3>60-minute plan</h3><span class="pill">Day 1</span></div><p>10m — Learn the price / position / playability framework</p><p>30m — Play the 10 decisions below</p><p>15m — Review the benchmarks and your mistakes</p><p>5m — Write one takeaway</p></div>
 ${cards}
 <div class="card"><h3>Finish today's lesson</h3><p class="muted">Complete all 10 spots, then mark Day 1 complete. Day 2 is already waiting in the 30-day roadmap.</p><button class="btn" onclick="completeDay1()" ${completed<day1Spots.length?'disabled':''}>Complete Day 1</button></div>`;
}
function pickSpot(i,j){
  if(S.lessonAns && S.lessonAns[i]!==undefined)return;
  S.lessonAns=S.lessonAns||{}; S.lessonAns[i]=j; save(); renderToday();
}
function completeDay1(){
  const all=day1Spots.every((_,i)=>S.lessonAns && S.lessonAns[i]!==undefined);
  if(!all)return;
  if(!S.done.includes(1))S.done.push(1);
  S.day=2; save(); page('today');
}
function streak(){let n=0;for(let d=S.day;d>=1;d--){if(S.done.includes(d))n++;else if(d!==S.day)break}return n}
function streak(){let n=0;for(let d=S.day;d>=1;d--){if(S.done.includes(d))n++;else if(d!==S.day)break}return n}
function renderTrain(){
 document.getElementById("train").innerHTML=`<div class="card hero"><div class="kicker">30-day curriculum</div><div class="title">Play the game, then learn</div><p class="muted">The first 30 days are loaded. Day 1 starts with Big Blind defence. Each decision is presented as chips first; after you answer, you get a short GTO-style benchmark and practical considerations.</p></div>${lesson30.map(x=>`<div class="row"><b>Day ${x.d} · ${x.t}</b><span class="pill">${x.m}</span><div class="muted">${x.p}</div></div>`).join('')}`;
}
function answerExample(i,j){if(S.exDone[i]===undefined){S.exDone[i]=j;save();renderTrain()}}
function renderReview(){
 document.getElementById("review").innerHTML=`<div class="card"><div class="kicker">Hand review lab</div><h2>Capture uncertainty</h2><p class="muted">Don't only save huge pots. Save hands where your reasoning felt unclear.</p>
 <label>Hand / situation</label><textarea id="ht" placeholder="30bb, BTN opens 2.2x with A♠7♠, BB calls..."></textarea>
 <label>My decision</label><input id="dec" placeholder="Bet 25%">
 <label>Confidence 1–5</label><select id="conf"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
 <label>What was I thinking?</label><textarea id="think"></textarea>
 <label>After review: what would I change?</label><textarea id="learn"></textarea>
 <div class="actions"><button class="btn" id="saveh">Save hand</button></div></div>
 <div class="card"><h3>Saved hands (${S.hands.length})</h3><div class="list">${S.hands.slice().reverse().map(h=>`<div class="row"><b>${h.date}</b><span class="pill">Confidence ${h.conf}/5</span><div class="hand">${esc(h.hand)}</div><div class="muted"><b>Decision:</b> ${esc(h.dec)}</div><div class="muted"><b>Thinking:</b> ${esc(h.think)}</div><p><b>Lesson:</b> ${esc(h.learn||"Add after review.")}</p></div>`).join("")||"<p class='muted'>No hands saved yet.</p>"}</div></div>`;
 document.getElementById("saveh").onclick=()=>{let h={date:new Date().toLocaleString(),hand:ht.value,dec:dec.value,conf:conf.value,think:think.value,learn:learn.value};if(!h.hand.trim())return;S.hands.push(h);save();renderReview()}
}
function renderProgress(){
 let answered=Object.keys(S.ans).length, correct=Object.entries(S.ans).filter(([d,a])=>{let e=qForDay(+d);return a===e.a}).length;
 document.getElementById("progress").innerHTML=`<div class="card hero"><div class="kicker">Your development</div><div class="title">Progress, not results</div><div class="grid"><div class="stat"><span class="tiny">Days</span><b>${S.done.length}/90</b></div><div class="stat"><span class="tiny">Drill accuracy</span><b>${answered?Math.round(correct/answered*100)+"%":"—"}</b></div><div class="stat"><span class="tiny">Hands reviewed</span><b>${S.hands.length}</b></div><div class="stat"><span class="tiny">Examples attempted</span><b>${S.exDone.length}</b></div></div></div>
 <div class="card"><h3>Weekly review</h3><textarea id="wn" placeholder="What improved? What keeps going wrong? What will I focus on next week?">${esc(S.notes)}</textarea><div class="actions"><button class="btn" onclick="S.notes=document.getElementById('wn').value;save()">Save review</button></div></div>
 <div class="card"><h3>Bankroll discipline</h3><p class="muted">Keep poker money separate from living expenses. Set a regular ABI, a move-down rule and a shot-taking rule before results influence you.</p></div>
 <div class="card"><button class="btn ghost" onclick="if(confirm('Reset all app data?')){localStorage.removeItem('pc_pwa');location.reload()}">Reset all data</button></div>`;
}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]) )}
function render(){renderToday();document.getElementById("header").textContent=`Day ${S.day}/90 · ${S.done.length} complete`}
render();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body></html>
