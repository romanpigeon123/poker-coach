else {html+=`<div class="context"><div class="street">Preflop</div><div class="cards">${esc(spot.hand)}</div><div class="actionline">${spot.context}</div></div><div class="context"><div class="street">Flop · ${esc(spot.boardName)}</div><div class="cards">${esc(spot.board)}</div><div class="actionline">${spot.flop}</div></div>`;if(d.street==='Turn'||d.street==='River')html+=`<div class="context"><div class="street">Turn</div><div class="cards">${esc(spot.turn)}</div><div class="actionline">Decision context continues from the flop line.</div></div>`;if(d.street==='River')html+=`<div class="context"><div class="street">River</div><div class="cards">${esc(spot.river)}</div></div>`}

spot.choices.forEach((c,j)=>{let cls=ans!==undefined?(j===spot.correct?'correct':(j===ans?'wrong':'')):'';html+=`<button class="choice ${cls}" onclick="answer(${j})" ${ans!==undefined?'disabled':''}>${c}</button>`});
if(ans!==undefined)html+=`<div class="feedback ${ans===spot.correct?'good':'bad'}"><b>${ans===spot.correct?'Correct':'Review this one'}</b><div>${spot.ex}</div></div>`;
html+=`<div class="nextbar"><button class="btn secondary" onclick="prevSpot()" ${i===0?'disabled':''}>← Previous</button><span class="tiny">${i+1}/50</span><button class="btn" onclick="nextSpot()" ${ans===undefined?'disabled':''}>${i===49?'Finish':'Next →'}</button></div></div>`;
html+=`<div class="group-title">All lessons</div>`;for(const group of ['BTN','BB']){html+=`<div class="group-title">${group}</div>`;lessonDefs.filter(x=>x.pos===group).forEach(x=>{let sc=score(x.id);html+=`<div class="lesson" onclick="openLesson('${x.id}')"><div class="lesson-top"><div><span class="pill">${x.street}</span><h3>${x.title}</h3><small>50 spots · ${x.id===S.lesson?'Current lesson':'Available now'}</small></div><div class="score">${sc===null?'—':sc+'%'}</div></div></div>`})}
document.getElementById('drills').innerHTML=html}
function renderProgress(){let total=0,correct=0;lessonDefs.forEach(d=>{let h=S.history[d.id]||{};total+=h.answered||0;correct+=h.correct||0});let overall=total?Math.round(correct/total*100):0;let html=`<div class="card hero"><div class="kicker">Progress</div><div class="title">Your GTO training</div><div class="grid"><div class="stat"><span class="tiny">Answered</span><b>${total}</b></div><div class="stat"><span class="tiny">Accuracy</span><b>${total?overall+'%':'—'}</b></div></div><p class="muted">Every lesson is available. Your results recommend what to train next; they never lock the curriculum.</p></div>`;
for(const group of ['BTN','BB']){html+=`<div class="group-title">${group}</div>`;lessonDefs.filter(x=>x.pos===group).forEach(d=>{let h=S.history[d.id]||{};let sc=h.answered?Math.round(h.correct/h.answered*100):null;html+=`<div class="card"><div class="section-title"><div><b>${d.title}</b><div class="tiny">${h.answered||0}/50 completed</div></div><span class="pill">${sc===null?'Not started':sc+'%'}</span></div><div class="bar"><i style="width:${Math.round((h.answered||0)/50*100)}%"></i></div><div class="actions"><button class="btn secondary" onclick="openLesson('${d.id}')">Train this lesson</button></div></div>`})}
html+=`<div class="card"><div class="section-title"><h3 style="margin:0">Recommended next</h3><span class="pill">No locks</span></div><p class="muted">${recommend().title}</p><button class="btn" onclick="openLesson('${recommend().id}')">Start recommended lesson</button></div>`;
document.getElementById('progress').innerHTML=html}
function recommend(){for(const d of lessonDefs){let h=S.history[d.id];if(!h||h.answered<50||((h.correct/h.answered)*100)<80)return d}return lessonDefs[0]}
function answer(j){let d=currentDef(),spot=lessons[d.id][S.idx];S.lessonAns[d.id]=S.lessonAns[d.id]||{};if(S.lessonAns[d.id][S.idx]!==undefined)return;S.lessonAns[d.id][S.idx]=j;let h=S.history[d.id]||{answered:0,correct:0};h.answered++;if(j===spot.correct)h.correct++;S.history[d.id]=h;save();renderDrills()}
function nextSpot(){if(S.idx<49){S.idx++;save();renderDrills();window.scrollTo(0,0)}else{renderDrills();window.scrollTo(0,0)}}
function prevSpot(){if(S.idx>0){S.idx--;save();renderDrills();window.scrollTo(0,0)}}
function openLesson(id){S.lesson=id;S.idx=0;save();showTab('drills');window.scrollTo(0,0)}
function showTab(t){document.getElementById('drills').classList.toggle('hidden',t!=='drills');document.getElementById('progress').classList.toggle('hidden',t!=='progress');document.getElementById('navDrills').classList.toggle('active',t==='drills');document.getElementById('navProgress').classList.toggle('active',t==='progress');t==='drills'?renderDrills():renderProgress();window.scrollTo(0,0)}
showTab('drills');
</script></body></html>
